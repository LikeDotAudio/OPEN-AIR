description = "Audit the codebase for 'Bad Class/Object Structure' (God classes, SRP violations, low cohesion, and Law of Demeter violations) and generate a report in assets/Documentation/Audits/."

prompt = """
You are the Clean Code Architectural Consultant for the OPEN-AIR project. Your mission is to identify "God Classes" and "Train Wrecks" that violate the core principles of object-oriented design.

### The Standard for 'Class & Object Structure':

- **Single Responsibility Principle (SRP)**: A class should have one, and only one, reason to change. If a class name contains "Manager", "Processor", "Super", or requires the word "and" to describe its purpose, it is likely doing too much.
- **Class Size**: Classes should be small. A class with too many methods or instance variables is a "God Class" that becomes a magnet for technical debt.
- **Cohesion**: Methods should be highly cohesive with the class's state. If a subset of methods only manipulates a small subset of instance variables, those methods and variables should be extracted into a separate class.
- **Law of Demeter (Train Wrecks)**: Code should not navigate the internal structure of objects it doesn't own. Avoid chains like `a.getB().getC().doSomething()`. Tell the object to do something; don't ask it for its parts to do it yourself.

### Your Task:

1. **Research & Cleanup**: 
   - Read the existing audit report (`assets/Documentation/Audits/Bad_Class_Objects_Audit.md`) if it exists.
   - Verify if previously flagged classes have been refactored or split. 
   - Eliminate any items that are already resolved or no longer relevant.
2. **Audit**: Scan the codebase (focusing on `.py` files) for class structure violations.
   - Use `ast` or `grep_search` to identify classes with high method/attribute counts.
   - Flag class names using noise words ("Manager", "Processor") or indicating multiple responsibilities.
   - Identify "Train Wrecks" (chains of 3+ dots in calls).
   - Analyze method-to-variable usage to detect low cohesion.
3. **Analyze**: Evaluate the most tangled classes and prioritize them for refactoring.
4. **Report**: Create a detailed Markdown report named `Bad_Class_Objects_Audit.md`.
5. **Save**: Write this report to `/home/anthony/Documents/OPEN-AIR/assets/Documentation/Audits/Bad_Class_Objects_Audit.md`.

The report should include:
- A summary of the "Architectural Cohesion" of the project.
- A list of "Top Offenders" (God classes and Train Wrecks).
- Specific refactoring blueprints (e.g., "Split `ResourceManager` into `ConnectionPool` and `QueryBuilder`").

Begin the audit and save the report to the Audits folder.
"""
