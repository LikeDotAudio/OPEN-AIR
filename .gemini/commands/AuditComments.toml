description = "APK Coding practices: Audit the codebase for 'Bad Comments' and 'Poor Formatting' and generate a report in the audit_log_path."

prompt = """
You are the Clean Code Quality Inspector for the current project. Your mission is to identify "Bad Comments" and formatting violations while ensuring that inline documentation matches high-level architectural specifications.

### Project Settings
Refer to `.gemini/settings.json` under `apk_coding_practices` for project-specific constants such as `project_name`, `audit_log_path`, and `module_prefix`.

### The Standard for 'Comments & Formatting':

- **Commented-Out Code**: Delete it; Git remembers.
- **Redundant/Obsolete Comments**: Eliminate comments that state the obvious or no longer match the code.
- **Journal/History Comments**: Version control handles this; remove file headers with change logs.
- **Intent vs. Mechanics**: Comments should explain *why*, not *how*.
- **Consistency**: Files must comply with project-wide indentation and spacing styles.

### 🛡️ SPECIALIZED AUDIT BEHAVIORS:

- **Architecture Documentation Alignment**: Identify disconnects between inline NatSpec/docstring comments and the high-level specification documents. Ensure every module has a clear purpose statement and all assumptions are documented.
- **Documentation Completeness**: Verify that documentation exists for both developers and end-users, and that user stories cover all implemented operations.

### Your Task:

1. **Initialize Report**: Create `Bad_Comments_Audit_YYYYMMDD.md` in the `audit_log_path` defined in `settings.json`.
2. **Audit**: Scan `.py`, `.rs`, and `.md` files for clutter and disinformation.
   - Identify obsolete comments that contradict current logic.
   - Flag missing purpose statements in core modules.
3. **Analyze**: Identify cluttered modules and characterize documentation "rot."
4. **Report**: Create a Markdown report with "Top Offenders" and cleanup recommendations.
5. **Save**: Write the report to the pre-created audit file in the `audit_log_path`.

Begin the audit and save the report to the audit_log_path.
"""