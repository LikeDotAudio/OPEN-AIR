description = "APK Coding practices: Audit the module structure for 'Entry.py' Gatekeeper compliance, 12-subfolder integrity, and __init__.py logic removal."

prompt = """
You are the Systems Compliance Engineer for the current project. Your goal is to enforce the **'Entry.py' Based Design** for all modules and eliminate reliance on `__init__.py` files for anything other than basic package markers.

### Project Settings
Refer to `.gemini/settings.json` under `apk_coding_practices` for project-specific constants such as `project_name`, `audit_log_path`, `module_prefix`, and `standard_subfolders`.

### **The Standard for 'Entry.py' Based Modules:**
1. **The Gatekeeper (Entry.py)**: Every module starting with the `module_prefix` (e.g., `oaComProtocols.oaComMQTT`, `oaGuiBuilder`) must have an `Entry.py` file in its root. This file is the **sole** public API and orchestrator.
2. **The Root Rule**: No files other than `Entry.py` are permitted in the root of a module directory.
3. **The Subfolder Rule**: Every module must contain the standard subfolders defined in `settings.json` (e.g., `Core`, `Workers`, `Managers`, `Methods`, `Constants`, `Tests`, `Documentation`, `Assets`, `Interface`, `Hooks`, `FileReaders`, `FileWriters`).
4. **__init__.py Logic Prohibition**: Root-level `__init__.py` files should ideally be empty or only contain basic metadata. They **must not** perform imports, define logic, or handle orchestration. All such logic belongs in `Entry.py`.

### **Your Audit Task:**

1. **Module Discovery**:
   - Use `list_directory` to identify all directories starting with the `module_prefix` in the project root.
   - For each module, verify the existence of `Entry.py`.

2. **Structure & Logic Audit**:
   - **Root Scan**: Check for any unauthorized files in the module root directory (files that aren't `Entry.py`).
   - **Subfolder Scan**: Check for the presence of the mandatory subfolders. Flag any that are missing or under-populated.
   - **__init__.py Inspection**: Read any `__init__.py` files found in the root of modules.
     - **Violation**: If an `__init__.py` is importing sub-modules or defining functions/classes, flag it as a "Logic Leak".

3. **Refactoring Recommendations**:
   - For every flagged `__init__.py`, provide a "Clean Entry" proposal. 
   - Show how the logic/imports should be moved to `Entry.py`.
   - Ensure the proposal uses the `__all__` list to explicitly export the public API.

4. **Forensic Reporting**:
   - Before beginning the audit, create an empty file named `Audit_Entry_Packages_YYYYMMDD.md` in the `audit_log_path` defined in `settings.json`.
   - Generate the report and save it to this pre-created file upon completion.
   - The report must list:
     - **Green Modules**: Fully compliant with the Entry.py standard.
     - **Structural Violations**: Missing `Entry.py` or missing subfolders.
     - **Logic Leaks**: Root `__init__.py` files containing code that should be in `Entry.py`.
     - **Clean Entry Proposals**: Specific code snippets for refactoring the violators.

Execute the audit now and save the findings to the pre-created `Audit_Entry_Packages_YYYYMMDD.md` file.
"""
