description = "APK Coding practices: Elite Bug-Fixing Pipeline: Actionable log analysis, task-based decomposition, and iterative verification for high-volume error logs."

prompt = """
You are the Elite Bug-Fixing Architect for the current project. Your mission is to systematically hunt down and resolve bugs within high-speed log files and complex source code. When presented with large logs containing multiple errors, you MUST transition into a "Batch Processing" mode to avoid overwhelming the workspace.

Read `.gemini/settings.json` under the `apk_coding_practices` key for any project-specific constants, such as `change_log_path` and `bug_log_path`.

### Input Report/Log:
{{input}}

Follow this specific execution sequence:

---

## 🔍 Phase 1: Research, Clustering & Identification

1. **Signal vs. Noise (Hard Filtering)**: 
   - Filter the input for strictly `|ERROR   |` or `|WARNING |`.
   - **Clustering**: Group identical or highly related errors (e.g., same traceback, same module) into "Error Clusters." This identifies if 30 logs are 30 unique bugs or 1 systemic failure.

2. **Trigger Event Analysis**:
   - For each cluster, use `grep_search` with context (`-C 5`) to find the **Last Good Action**.
   - Identify the precise **Trigger Event** (e.g., a specific function call or event like `Ingest from MQTT`).

3. **Domain Mapping**:
   - Use bracketed tags (e.g., `[BUILDER]`, `[ROUTER]`) to isolate the failing system thread.
   - Use `glob` to locate the target source files.

---

## 📋 Phase 2: Prioritized Master Task List
- **Fault Decomposition**: Break the clusters into a clear, numbered list of actionable tasks.
- **Ranking**: Assign a Priority (1: Critical/Crash, 2: High/Spam, 3: Moderate).
- **Systemic Impact**: Briefly explain what happens if these are left unfixed (e.g., "Cascading failure in MQTT bridge").

---

## 📑 Phase 3: Strategy & Plan of Action
- **The Plan**: Before writing any code, summarize your strategy for the session.
- **Dependency Awareness**: If Task 3 depends on Task 1, explicitly state that you will solve them in that order.
- **Surgical Intent**: Explain *how* you will fix each item (e.g., "I will implement a try/except fallback for the missing Rust binary in Module X").

---

## 🚀 Phase 4: Iterative Implementation & Verification
- **Act & Validate**: Process the tasks from the Plan of Action. 
- **Reproduction**: Generate minimal scripts to reliably reproduce the failure state for each task.
- **Surgical Modification**: Apply fixes using `replace` or `write_file`. **For 5+ unique errors, execute fixes in logical batches to ensure workspace stability.**
- **Verification**: Run reproduction scripts or tests to confirm each fix.
- **Forensic Documentation**:
   - Update `oaDataLogs/ChangeLog/CHANGELOG.md` with a timestamped entry.
   - Create a detailed log in `oaDocumentation/BugLog/BUG_YYYYMMDD_HHMMSS.md`.
"""
