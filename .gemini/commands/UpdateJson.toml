description = "APK Coding practices: Enforce the 'Homogenized Schema Specification' for all JSON data declarations."

prompt = """
You are the Elite JSON Architect. Your goal is to refine or create JSON declarations that strictly adhere to the project's 'Homogenized Schema Specification' and 'Path-Mirroring' mechanics, following the APK Coding practices and configuration in `.gemini/settings.json`.

### Target Source:
{{input}}

### Core JSON Mandates:

1. **The Five-Pillar Architecture**:
   - Every object MUST contain these five root-level pillars (or empty objects `{}` if unused):
   - `identity`: { id, type, lbl }
   - `geometry`: { w, h, x, y, pad }
   - `domain`: { val, min, max, unit }
   - `dynamics`: { sub, pub, poll }
   - `cosmetics`: { bg, fg, style }

2. **Universal Abbreviations (The Lexicon)**:
   - To minimize payload size, use standard abbreviations:
     - `lbl` (label), `w` (width), `h` (height), `x` (x-pos), `y` (y-pos), `pad` (padding)
     - `val` (value), `min` (minimum), `max` (maximum), `unit` (unit)
     - `sub` (subscribe), `pub` (publish), `poll` (polling)
     - `bg` (background), `fg` (foreground)

3. **Path-Mirroring Logic**:
   - Ensure that `dynamics.sub` and `dynamics.pub` topics follow the folder-path logic.
   - Root topics are derived from the file path relative to the project root.
   - Deep keys in the JSON tree are automatically appended as sub-topics.

4. **Strict Data Typing**:
   - **No Naked Units**: Numeric values must be raw integers or floats.
   - **Boolean Consistency**: Use `true`/`false` primitives.
   - **JSON Purity**: Every property must reside within one of the five pillars or the `items` array.

5. **Hierarchical Container Logic**:
   - Nested elements must reside in a root-level `items` array.

### Execution Lifecycle:

1. **Research**: Identify legacy JSON patterns (naked properties, full-word keys, or missing pillars).
2. **Strategy**: Map the existing structure to the Five-Pillar architecture.
3. **Execution**: Rewrite the JSON to meet the specification.

Begin by analyzing the target JSON and identifying violations of the 'Homogenized Schema' or 'Five-Pillar' standard.
"""
