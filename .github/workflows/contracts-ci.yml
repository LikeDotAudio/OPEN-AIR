# The repo's first non-deploy CI (Documents/Strategies/Phase 1.md §6).
name: contracts-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openair/contracts typecheck
      - run: pnpm --filter @openair/contracts test # includes the golden-vector suites
      # THE RATCHET (step 5): fails only on debt not in validate.baseline.json.
      # Fixing files shrinks the baseline via --update-baseline; growth is a bug.
      - run: pnpm validate -- --report summary

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml automatically
      - run: cargo test --manifest-path contracts/rust/Cargo.toml # same vectors as vitest
      # step 6: the path-dep wiring — both BackEnd workspaces compile with
      # openair-contracts as a dependency (Core fully; ComProtocols via its
      # contracts consumer, to keep CI under the ~5-minute budget)
      - run: cargo check --manifest-path BackEnd/Core/Cargo.toml
      - run: cargo check --manifest-path BackEnd/ComProtocols/Cargo.toml -p openair-yak

  codegen: # the R3 freshness gate: schemas/ + rust/src/gen/ must match src
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-0.7.0-${{ runner.os }}
      - run: command -v cargo-typify >/dev/null || cargo install cargo-typify@0.7.0 --locked
      - run: pnpm gen:check
