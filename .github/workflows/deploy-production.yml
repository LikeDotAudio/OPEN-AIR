name: Deploy · Production

# EVERY push publishes to FTPS.
#
# Previously this only fired for `main`, so work pushed on any other branch
# silently never reached the host — the "it doesn't publish every time"
# symptom. Now every branch deploys EXCEPT the sandbox branches, which have
# their own workflow and their own host.
#
# PRs still validate without uploading.
on:
  push:
    branches-ignore: [sandbox, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full resync: ignore the server-side sync state and re-upload everything"
        type: boolean
        default: false

# One production deploy at a time; queue rather than cancel, so no push is
# silently dropped when two land together.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate. Until this existed, contracts-ci.yml ran independently and could not
  # block a release — a push that broke the contracts still published to the
  # production host. This does NOT change which branches deploy (every branch
  # still publishes, deliberately); it changes whether a broken one may.
  verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: Deployment/.nvmrc

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm -C Deployment install --frozen-lockfile

      - name: Typecheck contracts
        run: pnpm -C Deployment --filter @openair/contracts typecheck

      - name: Test contracts
        run: pnpm -C Deployment --filter @openair/contracts test

      # The drift ratchet: fails on NEW debt, not on the baselined backlog.
      - name: Validate (ratchet)
        run: pnpm -C Deployment validate -- --report summary

  deploy:
    needs: verify
    # `verify` is skipped on pull_request (nothing uploads there), and a skipped
    # dependency would otherwise skip this job too — taking the PR validation
    # step with it. Proceed when verify passed OR was skipped; never when it failed.
    if: always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: production         # pulls production-scoped secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Regenerates FrontEnd/api/tree.json — the static host has no
      # orchestrator, so the browser's live /api/tree falls back to this.
      - name: Build API artifacts
        run: python3 Deployment/build_api_artifacts.py

      - name: Deploy over FTPS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR || '/' }}
          local-dir: ./FrontEnd/
          # Wipe + re-upload when the sync state has drifted (manual runs).
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync }}
          # Never publish secrets or local junk. The action's defaults do NOT
          # exclude .env — and the repo-root .env holds FTP credentials locally
          # (not FrontEnd/.env, which no longer exists and must stay gone).
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/*.log
            **/.DS_Store

      - name: Publish summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### 🚀 Published to production over FTPS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| Source | \`./FrontEnd/\` |"
            echo "| Full resync | \`${{ inputs.full_sync || false }}\` |"
            echo ""
            echo "_Uploads are incremental: the action keeps"
            echo "\`.ftp-deploy-sync-state.json\` on the server and skips unchanged"
            echo "files. If the site looks stale, re-run this workflow with"
            echo "**full_sync = true**._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate only (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m py_compile Deployment/build_api_artifacts.py
          echo "PR validated: build script compiles. No upload on PRs."
