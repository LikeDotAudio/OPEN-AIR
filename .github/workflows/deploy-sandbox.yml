name: Deploy · Sandbox

# Branch = environment. Pushing sandbox/develop deploys to the sandbox host.
# PRs targeting those branches validate the deploy but do NOT upload.
on:
  push:
    branches: [sandbox, develop]
  pull_request:
    branches: [sandbox, develop]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full resync: upload every file by mtime/size, not just the pushed diff"
        type: boolean
        default: false

# One deploy at a time per environment.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  # Same gate as production: contracts must typecheck, test, and clear the
  # drift ratchet before anything reaches the sandbox host.
  verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: Deployment/.nvmrc

      - name: Install the pinned pnpm
        run: |
          set -euo pipefail
          PNPM_VERSION="$(node -p "require('./Deployment/package.json').packageManager.split('@')[1]")"
          echo "Deployment/package.json pins pnpm@$PNPM_VERSION"
          # `corepack enable` used to be here, and it is the whole problem.
          # corepack resolves `packageManager` by searching up from the current
          # directory; every pnpm call below runs from the repo root via
          # `-C Deployment`, and the root has no package.json. So corepack found
          # no pin, fetched whatever pnpm was newest, and pnpm then read the pin,
          # saw a different version and refused — "pnpm does not switch versions
          # when running under corepack". Nothing in the repo changed to cause
          # it: the pin was satisfied only while "newest pnpm" happened to equal
          # it, so an upstream release was enough to break every deploy.
          #
          # The runner image also ships corepack SHIMS on PATH, so not calling
          # `corepack enable` is not sufficient on its own — the shim would still
          # be the pnpm that ran. Disabling removes them.
          corepack disable || true
          npm i -g "pnpm@$PNPM_VERSION"
          hash -r || true
          echo "pnpm on PATH: $(command -v pnpm)"
          ACTUAL="$(pnpm --version)"
          echo "pnpm version: $ACTUAL"
          # Assert rather than hope: otherwise a wrong version fails further
          # down, in a step about the pin rather than about what chose it.
          [ "$ACTUAL" = "$PNPM_VERSION" ] || {
            echo "::error::pnpm on PATH is $ACTUAL but Deployment/package.json pins $PNPM_VERSION"
            command -v -a pnpm || true
            exit 1
          }

      - name: Install
        run: pnpm -C Deployment install --frozen-lockfile

      - name: Typecheck contracts
        run: pnpm -C Deployment --filter @openair/contracts typecheck

      - name: Test contracts
        run: pnpm -C Deployment --filter @openair/contracts test

      - name: Validate (ratchet)
        run: pnpm -C Deployment validate -- --report summary

  deploy:
    needs: verify
    # See deploy-production.yml: skipped-dependency handling for the PR path.
    if: always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: sandbox            # pulls sandbox-scoped secrets
    steps:
      - name: Checkout (full history for commit-range diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # deploy.py diffs before..sha; needs history

      # See deploy-production.yml for the full story: the "Build API Artifacts"
      # step that ran Deployment/build_api_artifacts.py was a no-op on the runner
      # (stale __file__/../../../.. after the script moved to Deployment/), and
      # its Rust port is deliberately not wired in, because a runner checkout is
      # missing the generated, gitignored trees the committed snapshot contains.
      - name: Check the committed API fallbacks are intact
        run: |
          set -euo pipefail
          for f in FrontEnd/api/tree.json FrontEnd/api/grabbag; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          node -e 'JSON.parse(require("fs").readFileSync("FrontEnd/api/tree.json","utf8"))'
          echo "tree.json parses — $(wc -c < FrontEnd/api/tree.json) bytes"

      - name: Deploy over FTPS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR || '/' }}
          local-dir: ./FrontEnd/
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync }}
          # Never publish secrets or local junk — the action's defaults do NOT
          # exclude .env, and the repo-root .env holds FTP credentials locally
          # (not FrontEnd/.env, which no longer exists and must stay gone).
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/*.log
            **/.DS_Store

      - name: Validate only (pull request)
        if: github.event_name == 'pull_request'
        run: |
          echo "PR validated: API fallbacks checked above. No upload on PRs."
