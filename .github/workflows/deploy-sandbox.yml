name: Deploy · Sandbox

# Branch = environment. Pushing sandbox/develop deploys to the sandbox host.
# PRs targeting those branches validate the deploy but do NOT upload.
on:
  push:
    branches: [sandbox, develop]
  pull_request:
    branches: [sandbox, develop]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full resync: upload every file by mtime/size, not just the pushed diff"
        type: boolean
        default: true

# One deploy at a time per environment.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox            # pulls sandbox-scoped secrets
    steps:
      - name: Checkout (full history for commit-range diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # deploy.py diffs before..sha; needs history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deploy dependencies
        run: pip install -r FrontEnd/requirements-deploy.txt

      # deploy.py regenerates FrontEnd/api/tree.json from Gui_Frames itself, so
      # there is no separate build step (the site uses CDN React/Babel, no npm).
      - name: Deploy over FTPS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          DEPLOY_ENV: sandbox
          # Manual runs default to a full resync; pushes use the commit-range diff.
          DEPLOY_FULL_SYNC: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_sync) && '1' || '' }}
          DEPLOY_DIFF_BASE: ${{ github.event.before }}
          DEPLOY_DIFF_HEAD: ${{ github.sha }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          REMOTE_DIR: ${{ secrets.REMOTE_DIR }}
          MQTT_HOST: ${{ secrets.MQTT_HOST }}
          MQTT_PORT: ${{ secrets.MQTT_PORT }}
          MQTT_USER: ${{ secrets.MQTT_USER }}
          MQTT_PASS: ${{ secrets.MQTT_PASS }}
          MQTT_TOPIC: ${{ secrets.MQTT_TOPIC }}
        run: python3 FrontEnd/deploy_FTP_to_like_dot_audio.py

      - name: Validate only (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m py_compile FrontEnd/deploy_FTP_to_like_dot_audio.py
          echo "PR validated: deploy script compiles. No upload on PRs."
