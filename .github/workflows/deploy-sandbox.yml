name: Deploy · Sandbox

# Branch = environment. Pushing sandbox/develop deploys to the sandbox host.
# PRs targeting those branches validate the deploy but do NOT upload.
on:
  push:
    branches: [sandbox, develop]
  pull_request:
    branches: [sandbox, develop]
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full resync: upload every file by mtime/size, not just the pushed diff"
        type: boolean
        default: true

# One deploy at a time per environment.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: sandbox            # pulls sandbox-scoped secrets
    steps:
      - name: Checkout (full history for commit-range diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # deploy.py diffs before..sha; needs history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build API Artifacts
        run: python3 Deployment/build_api_artifacts.py

      - name: Deploy over FTPS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR || '/' }}
          local-dir: ./FrontEnd/

      - name: Validate only (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python3 -m py_compile Deployment/build_api_artifacts.py
          echo "PR validated: build script compiles. No upload on PRs."
