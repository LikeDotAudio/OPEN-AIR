name: Deploy

# EVERY push publishes to FTPS.
#
# Branches 'non-prod' and 'develop' deploy to the non-prod host.
# All other branches deploy to the production host.
#
# PRs validate without uploading.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full resync: ignore the server-side sync state and re-upload everything"
        type: boolean
        default: false

# One deploy at a time per branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate. Until this existed, contracts-ci.yml ran independently and could not
  # block a release — a push that broke the contracts still published to the
  # production host.
  verify:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: Deployment/.nvmrc

      - name: Install the pinned pnpm
        run: |
          set -euo pipefail
          PNPM_VERSION="$(node -p "require('./Deployment/package.json').packageManager.split('@')[1]")"
          echo "Deployment/package.json pins pnpm@$PNPM_VERSION"
          # `corepack enable` used to be here, and it is the whole problem.
          # corepack resolves `packageManager` by searching up from the current
          # directory; every pnpm call below runs from the repo root via
          # `-C Deployment`, and the root has no package.json. So corepack found
          # no pin, fetched whatever pnpm was newest, and pnpm then read the pin,
          # saw a different version and refused — "pnpm does not switch versions
          # when running under corepack". Nothing in the repo changed to cause
          # it: the pin was satisfied only while "newest pnpm" happened to equal
          # it, so an upstream release was enough to break every deploy.
          #
          # The runner image also ships corepack SHIMS on PATH, so not calling
          # `corepack enable` is not sufficient on its own — the shim would still
          # be the pnpm that ran. Disabling removes them.
          corepack disable || true
          npm i -g "pnpm@$PNPM_VERSION"
          hash -r || true
          echo "pnpm on PATH: $(command -v pnpm)"
          ACTUAL="$(pnpm --version)"
          echo "pnpm version: $ACTUAL"
          # Assert rather than hope: otherwise a wrong version fails further
          # down, in a step about the pin rather than about what chose it.
          [ "$ACTUAL" = "$PNPM_VERSION" ] || {
            echo "::error::pnpm on PATH is $ACTUAL but Deployment/package.json pins $PNPM_VERSION"
            command -v -a pnpm || true
            exit 1
          }

      - name: Install
        run: pnpm -C Deployment install --frozen-lockfile

      - name: Typecheck contracts
        run: pnpm -C Deployment --filter @openair/contracts typecheck

      - name: Lint code
        run: pnpm -C Deployment lint

      - name: Test contracts
        run: pnpm -C Deployment --filter @openair/contracts test

      # The drift ratchet: fails on NEW debt, not on the baselined backlog.
      - name: Validate (ratchet)
        run: pnpm -C Deployment validate -- --report summary

  deploy:
    needs: verify
    # `verify` is skipped on pull_request (nothing uploads there), and a skipped
    # dependency would otherwise skip this job too — taking the PR validation
    # step with it. Proceed when verify passed OR was skipped; never when it failed.
    if: always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/non-prod' || github.ref == 'refs/heads/develop') && 'non-prod' || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # FrontEnd/api/{tree.json,grabbag} are the fallbacks index.html uses when
      # no orchestrator is answering, and the static host has none. They are
      # COMMITTED and shipped as-is.
      - name: Check the committed API fallbacks are intact
        run: |
          set -euo pipefail
          for f in FrontEnd/api/tree.json FrontEnd/api/grabbag; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          node -e 'JSON.parse(require("fs").readFileSync("FrontEnd/api/tree.json","utf8"))'
          echo "tree.json parses — $(wc -c < FrontEnd/api/tree.json) bytes"

      - name: Deploy over FTPS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR || '/' }}
          local-dir: ./FrontEnd/
          # Wipe + re-upload when the sync state has drifted (manual runs).
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync }}
          # Never publish secrets or local junk. The action's defaults do NOT
          # exclude .env — and the repo-root .env holds FTP credentials locally
          # (not FrontEnd/.env, which no longer exists and must stay gone).
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/*.log
            **/.DS_Store

      - name: Publish summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### 🚀 Published to ${{ (github.ref == 'refs/heads/non-prod' || github.ref == 'refs/heads/develop') && 'non-prod' || 'production' }} over FTPS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| Source | \`./FrontEnd/\` |"
            echo "| Full resync | \`${{ inputs.full_sync || false }}\` |"
            echo ""
            echo "_Uploads are incremental: the action keeps"
            echo "\`.ftp-deploy-sync-state.json\` on the server and skips unchanged"
            echo "files. If the site looks stale, re-run this workflow with"
            echo "**full_sync = true**._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate only (pull request)
        if: github.event_name == 'pull_request'
        run: |
          echo "PR validated: API fallbacks checked above. No upload on PRs."

  deploy-manual:
    needs: verify
    if: always() && needs.verify.result != 'failure' && needs.verify.result != 'cancelled' && github.ref != 'refs/heads/non-prod' && github.ref != 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # We need git history to check stale docs

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for stale HTML documents
        run: |
          cd Documentation/Manual
          node check_stale_docs.js

      - name: Deploy Manual over FTPS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR || '/' }}manual/
          local-dir: ./Documentation/Manual/
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/*.log
            **/.DS_Store
            **/*.js
