name: Deploy

# EVERY push publishes to FTPS.
#
# Branches 'non-prod' and 'develop' deploy to the non-prod host.
# All other branches deploy to the production host.
#
# PRs validate without uploading.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:
    inputs:
      full_sync:
        description: "Full resync: ignore the server-side sync state and re-upload everything"
        type: boolean
        default: false

# One deploy at a time per branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    outputs:
      frontend_changed: ${{ steps.changes.outputs.frontend_any_changed }}
      manual_changed: ${{ steps.changes.outputs.manual_any_changed }}
      ts_js_changed: ${{ steps.changes.outputs.ts_js_any_changed }}
      ts_js_files: ${{ steps.changes.outputs.ts_js_all_changed_files }}
      contracts_changed: ${{ steps.changes.outputs.contracts_any_changed }}
      contracts_files: ${{ steps.changes.outputs.contracts_all_changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            frontend:
              - FrontEnd/**
              - ui/**
            manual:
              - Documentation/Manual/**
            ts_js:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
            contracts:
              - 'contracts/**'

  lint:
    needs: pre-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: Deployment/.nvmrc

      - name: Install the pinned pnpm
        run: |
          set -euo pipefail
          PNPM_VERSION="$(node -p "require('./Deployment/package.json').packageManager.split('@')[1]")"
          corepack disable || true
          npm i -g "pnpm@$PNPM_VERSION"
          hash -r || true
          ACTUAL="$(pnpm --version)"
          [ "$ACTUAL" = "$PNPM_VERSION" ] || {
            echo "::error::pnpm on PATH is $ACTUAL but Deployment/package.json pins $PNPM_VERSION"
            exit 1
          }

      - name: Install
        run: pnpm -C Deployment install --frozen-lockfile

      - name: Pre-check & Validate
        run: |
          echo "# 🔍 Pre-check Results" > $GITHUB_STEP_SUMMARY
          HAS_ERRORS=0

          echo "## Linting Changed UI Files" >> $GITHUB_STEP_SUMMARY
          UI_FILES=$(echo "${{ needs.pre-check.outputs.ts_js_files }}" | tr ' ' '\n' | grep '^ui/' | tr '\n' ' ' || true)
          if [ -n "$UI_FILES" ]; then
            set +e
            pnpm -C Deployment --filter ui exec eslint $UI_FILES > lint-out.txt 2>&1
            LINT_STATUS=$?
            set -e
            if [ $LINT_STATUS -eq 0 ]; then
               echo "✅ Lint passed" >> $GITHUB_STEP_SUMMARY
            else
               echo "❌ Lint failed" >> $GITHUB_STEP_SUMMARY
               echo '<details><summary>Logs</summary>' >> $GITHUB_STEP_SUMMARY
               echo '' >> $GITHUB_STEP_SUMMARY
               echo '```text' >> $GITHUB_STEP_SUMMARY
               cat lint-out.txt >> $GITHUB_STEP_SUMMARY
               echo '```' >> $GITHUB_STEP_SUMMARY
               echo '</details>' >> $GITHUB_STEP_SUMMARY
               HAS_ERRORS=1
            fi
          else
            echo "No UI TS/JS files changed. Skipping lint." >> $GITHUB_STEP_SUMMARY
          fi
          if [ $HAS_ERRORS -ne 0 ]; then
             exit 1
          fi

  contracts-ci:
    needs: [pre-check, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: Deployment/.nvmrc

      - name: Install the pinned pnpm
        run: |
          set -euo pipefail
          PNPM_VERSION="$(node -p "require('./Deployment/package.json').packageManager.split('@')[1]")"
          corepack disable || true
          npm i -g "pnpm@$PNPM_VERSION"
          hash -r || true
          ACTUAL="$(pnpm --version)"
          [ "$ACTUAL" = "$PNPM_VERSION" ] || {
            echo "::error::pnpm on PATH is $ACTUAL but Deployment/package.json pins $PNPM_VERSION"
            exit 1
          }

      - name: Install
        run: pnpm -C Deployment install --frozen-lockfile

      - name: Typecheck & Test
        run: |
          echo "# 🔍 Tests & Typecheck Results" > $GITHUB_STEP_SUMMARY
          HAS_ERRORS=0

          echo "## Typecheck" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.pre-check.outputs.contracts_changed }}" == "true" ] || [ "${{ needs.pre-check.outputs.frontend_changed }}" == "true" ] || [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            set +e
            pnpm -C Deployment -r typecheck > typecheck-out.txt 2>&1
            TYPECHECK_STATUS=$?
            set -e
            if [ $TYPECHECK_STATUS -eq 0 ]; then
               echo "✅ Typecheck passed" >> $GITHUB_STEP_SUMMARY
            else
               echo "❌ Typecheck failed" >> $GITHUB_STEP_SUMMARY
               echo '<details><summary>Logs</summary>' >> $GITHUB_STEP_SUMMARY
               echo '' >> $GITHUB_STEP_SUMMARY
               echo '```text' >> $GITHUB_STEP_SUMMARY
               cat typecheck-out.txt >> $GITHUB_STEP_SUMMARY
               echo '```' >> $GITHUB_STEP_SUMMARY
               echo '</details>' >> $GITHUB_STEP_SUMMARY
               HAS_ERRORS=1
            fi
          else
             echo "No TS/JS files changed. Skipping typecheck." >> $GITHUB_STEP_SUMMARY
          fi

          echo "## Testing Changed Contracts" >> $GITHUB_STEP_SUMMARY
          CONTRACT_FILES=$(echo "${{ needs.pre-check.outputs.contracts_files }}" | tr ' ' '\n' | grep '^contracts/' | tr '\n' ' ' || true)
          if [ -n "$CONTRACT_FILES" ] || [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
            set +e
            if [ -n "$CONTRACT_FILES" ]; then
              pnpm -C Deployment --filter @openair/contracts exec vitest related $CONTRACT_FILES --run > test-out.txt 2>&1
            else
              pnpm -C Deployment --filter @openair/contracts test > test-out.txt 2>&1
            fi
            TEST_STATUS=$?
            set -e
            if [ $TEST_STATUS -eq 0 ]; then
               echo "✅ Tests passed" >> $GITHUB_STEP_SUMMARY
            else
               echo "❌ Tests failed" >> $GITHUB_STEP_SUMMARY
               echo '<details><summary>Logs</summary>' >> $GITHUB_STEP_SUMMARY
               echo '' >> $GITHUB_STEP_SUMMARY
               echo '```text' >> $GITHUB_STEP_SUMMARY
               cat test-out.txt >> $GITHUB_STEP_SUMMARY
               echo '```' >> $GITHUB_STEP_SUMMARY
               echo '</details>' >> $GITHUB_STEP_SUMMARY
               HAS_ERRORS=1
            fi
          else
            echo "No contract files changed. Skipping tests." >> $GITHUB_STEP_SUMMARY
          fi

          if [ $HAS_ERRORS -ne 0 ]; then
             exit 1
          fi

      - name: Validate (ratchet)
        run: pnpm -C Deployment validate -- --report summary

  deploy:
    needs: [pre-check, lint]
    if: always() && needs.lint.result != 'failure' && needs.lint.result != 'cancelled' && (needs.pre-check.outputs.frontend_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ (github.ref == 'refs/heads/non-prod' || github.ref == 'refs/heads/develop') && 'non-prod' || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the committed API fallbacks are intact
        run: |
          set -euo pipefail
          for f in FrontEnd/api/tree.json FrontEnd/api/grabbag; do
            [ -s "$f" ] || { echo "::error::$f is missing or empty"; exit 1; }
          done
          node -e 'JSON.parse(require("fs").readFileSync("FrontEnd/api/tree.json","utf8"))'
          echo "tree.json parses — $(wc -c < FrontEnd/api/tree.json) bytes"

      - name: Deploy over FTPS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR || '/' }}
          local-dir: ./FrontEnd/
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/*.log
            **/.DS_Store

      - name: Publish summary
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          {
            echo "### 🚀 Published to ${{ (github.ref == 'refs/heads/non-prod' || github.ref == 'refs/heads/develop') && 'non-prod' || 'production' }} over FTPS"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| Source | \`./FrontEnd/\` |"
            echo "| Full resync | \`${{ inputs.full_sync || false }}\` |"
            echo ""
            echo "_Uploads are incremental: the action keeps"
            echo "\`.ftp-deploy-sync-state.json\` on the server and skips unchanged"
            echo "files. If the site looks stale, re-run this workflow with"
            echo "**full_sync = true**._"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate only (pull request)
        if: github.event_name == 'pull_request'
        run: |
          echo "PR validated: API fallbacks checked above. No upload on PRs."

  deploy-manual:
    needs: [pre-check, lint]
    if: always() && needs.lint.result != 'failure' && needs.lint.result != 'cancelled' && github.ref != 'refs/heads/non-prod' && github.ref != 'refs/heads/develop' && (needs.pre-check.outputs.manual_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for stale HTML documents
        run: |
          cd Documentation/Manual
          node check_stale_docs.js

      - name: Deploy Manual over FTPS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.REMOTE_DIR || '/' }}manual/
          local-dir: ./Documentation/Manual/
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/*.log
            **/.DS_Store
            **/*.js
