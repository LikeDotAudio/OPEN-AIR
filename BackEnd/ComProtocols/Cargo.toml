# Communication-protocol crates workspace.
# Previously these were members of the repo-root workspace; that workspace was
# moved into BackEnd/Core, and Cargo requires members to live below their root,
# so the protocol crates now form their own sibling workspace here.
#
# openair-yak is NOT here: it is not a wire protocol but the definition plane
# that translates GUI intent into vendor SCPI, so it now stands as its own
# back end at BackEnd/openair-yak/ with its own workspace. Same rule as above —
# living outside this directory, it could not have stayed a member.
[workspace]
resolver = "2"
members = [
    "openair-aes70",
    "openair-AppleTV",
    "openair-AVB-Milan",
    "openair-ChromeCast",
    "openair-Dante",
    "openair-dnssd",
    "openair-ember",
    "openair-mdns",
    "openair-midi",
    "openair-mqtt",
    "openair-nmos",
    "openair-osc",
    "openair-printers",
    "openair-ptp",
    "openair-ravenna",
    "openair-rest",
    "openair-sap",
    "openair-smpte2138",
    "openair-snmp",
    "openair-visa",
    "openair-websocket",
]
