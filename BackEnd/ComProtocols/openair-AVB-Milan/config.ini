# AVB / Milan (AVDECC, IEEE 1722.1) discovery configuration
# Displayed in GUI: Window_2/.../4_Protocals/67_AVB
# Published to MQTT (retained) at: OpenAir/System/Config/avb
[avb]
enabled = true
# Layer 2 protocol: no IP address or port. Entities announce to the reserved
# multicast MAC below on EtherType 0x22F0. Requires CAP_NET_RAW to capture.
multicast_mac = 91:E0:F0:01:00:00
ethertype = 0x22F0
# Discovery lands under: OpenAir/System/Protocols/avb/Device/{entity_id}/{key}
# Entities expire on their own announced valid_time, or on ENTITY_DEPARTING.

# NOTE: no topic/topic_listen/topic_publish/topic_ignore keys here.
# This agent takes its broker address as a parameter and owns its topic in
# code; a declared triple that nothing reads is dead config, which the
# validator flags. Only add these keys if the agent actually reads them.
