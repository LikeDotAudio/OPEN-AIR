# Google Cast (Chromecast / Nest) discovery configuration
# Published to MQTT (retained) at: OpenAir/System/Config/chromecast
#
# DISCOVERY ONLY. This agent browses _googlecast._tcp and publishes what it
# finds; it does not speak the Cast V2 control protocol (TLS :8009 + protobuf
# over virtual channels). Nothing here can change a device's state.
[chromecast]
enabled = true
service_type = _googlecast._tcp
domain = local.
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/chromecast
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/chromecast/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/chromecast/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/chromecast/ignore
