# Google Cast (Chromecast / Nest) discovery configuration
# Published to MQTT (retained) at: OpenAir/System/Config/chromecast
#
# DISCOVERY ONLY. This agent browses _googlecast._tcp and publishes what it
# finds; it does not speak the Cast V2 control protocol (TLS :8009 + protobuf
# over virtual channels). Nothing here can change a device's state.
[chromecast]
enabled = true
service_type = _googlecast._tcp
domain = local.

# NOTE: no topic/topic_listen/topic_publish/topic_ignore keys here.
# This agent takes its broker address as a parameter and owns its topic in
# code; a declared triple that nothing reads is dead config, which the
# validator flags. Only add these keys if the agent actually reads them.
