# Dante discovery configuration — BOTH announcement mechanisms.
# Published to MQTT (retained) at: OpenAir/System/Config/dante
#
#   Native Dante : mDNS, Audinate service tags (_netaudio-arc/-cmc/-dbc/-chan._udp)
#   AES67 mode   : SAP multicast 239.255.255.255:9875 (Dante abandons mDNS here)
#
# DISCOVERY ONLY. Dante's connection management is proprietary; this agent
# reports what exists, and never routes or subscribes.
[dante]
enabled = true
service_type = _netaudio-arc._udp
domain = local.
sap_group = 239.255.255.255
sap_port = 9875

# NOTE: no topic/topic_listen/topic_publish/topic_ignore keys here.
# This agent takes its broker address as a parameter and owns its topic in
# code; a declared triple that nothing reads is dead config, which the
# validator flags. Only add these keys if the agent actually reads them.
