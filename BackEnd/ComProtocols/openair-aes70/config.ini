# AES70 (OCA / OCP.1 over TCP) protocol configuration
# Displayed in GUI: Window_2/.../4_Protocals/70_AES70
# Published to MQTT (retained) at: OpenAir/System/Config/aes70
[aes70]
enabled = true
host = 127.0.0.1
port = 50014
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/aes70
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/aes70/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/aes70/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/aes70/ignore
