# Ember+ protocol configuration
# Displayed in GUI: Window_2/.../4_Protocals/99_EMBER
# Published to MQTT (retained) at: OpenAir/System/Config/ember
[ember]
enabled = true
host = 127.0.0.1
port = 9000
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/ember
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/ember/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/ember/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/ember/ignore
