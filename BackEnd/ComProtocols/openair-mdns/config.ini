# mDNS service discovery configuration
# Displayed in GUI: Window_2/.../4_Protocals/67_MDNS
# Published to MQTT (retained) at: OpenAir/System/Config/mdns
[mdns]
enabled = true
service_type = _osc._udp
domain = local.
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/mdns
