# mDNS service discovery configuration
# Displayed in GUI: Window_2/.../4_Protocals/67_MDNS
# Published to MQTT (retained) at: OpenAir/System/Config/mdns
[mdns]
enabled = true
service_type = _osc._udp
domain = local.
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/mdns
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/mdns/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/mdns/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/mdns/ignore
