# MIDI protocol configuration
# Displayed in GUI: Window_2/.../4_Protocals/50_MIDI
# Published to MQTT (retained) at: OpenAir/System/Config/midi
[midi]
enabled = true
# Port names to bind; "auto" selects the first available port.
input_port = auto
output_port = auto
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/midi
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/midi/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/midi/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/midi/ignore
