# MIDI protocol configuration
# Displayed in GUI: Window_2/.../4_Protocals/50_MIDI
# Published to MQTT (retained) at: OpenAir/System/Config/midi
[midi]
enabled = true
# Port names to bind; "auto" selects the first available port.
input_port = auto
output_port = auto
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/midi
