# MQTT bus / broker configuration
# config.ini published to MQTT (retained) at: OpenAir/System/Config/mqtt
[mqtt]
enabled = true
host = 127.0.0.1
ws_port = 9001
tcp_port = 1883
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/mqtt
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/mqtt/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/mqtt/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/mqtt/ignore
