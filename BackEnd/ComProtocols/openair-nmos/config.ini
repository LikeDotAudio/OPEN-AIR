# NMOS (IS-04 / IS-05) protocol configuration
# Displayed in GUI: Window_2/.../4_Protocals/66_NMOS
# Published to MQTT (retained) at: OpenAir/System/Config/nmos
[nmos]
enabled = true
host = 127.0.0.1
port = 8080
registry_url = http://127.0.0.1:8080
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/nmos
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/nmos/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/nmos/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/nmos/ignore
