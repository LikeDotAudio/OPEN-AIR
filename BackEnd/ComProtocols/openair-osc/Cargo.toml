[package]
name = "openair-osc"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
rosc = "0.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

pyo3 = { version = "0.21.2", optional = true }

[features]
python = ["dep:pyo3"]
