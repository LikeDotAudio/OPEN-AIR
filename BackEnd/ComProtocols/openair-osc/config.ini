# OSC protocol configuration
# Displayed in GUI: Window_2/.../4_Protocals/55_OSC
# Published to MQTT (retained) at: OpenAir/System/Config/osc
[osc]
enabled = true
host = 0.0.0.0
port = 8000
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/osc
