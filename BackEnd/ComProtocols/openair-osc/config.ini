# OSC protocol configuration
# Displayed in GUI: Window_2/.../4_Protocals/55_OSC
# Published to MQTT (retained) at: OpenAir/System/Config/osc
[osc]
enabled = true
host = 0.0.0.0
port = 8000
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/osc
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/osc/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/osc/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/osc/ignore
