# Network printer discovery configuration
# Published to MQTT (retained) at: OpenAir/System/Config/printers
#
# Bonjour Printing Specification (AirPrint / Mopria / IPP Everywhere). One
# printer advertises up to six services (_ipp, _ipps, _ipp-tls, _printer,
# _pdl-datastream, _http); they are merged into ONE row keyed by the TXT UUID,
# with the service list surfaced as a `transports` column.
#
# DISCOVERY ONLY. No print jobs are submitted and no printer state is changed.
[printers]
enabled = true
service_type = _ipp._tcp
domain = local.

# NOTE: no topic/topic_listen/topic_publish/topic_ignore keys here.
# This agent takes its broker address as a parameter and owns its topic in
# code; a declared triple that nothing reads is dead config, which the
# validator flags. Only add these keys if the agent actually reads them.
