# REST protocol configuration
# Displayed in GUI: Window_2/.../4_Protocals/44_REST
# Published to MQTT (retained) at: OpenAir/System/Config/rest
[rest]
enabled = true
scheme = http
host = 127.0.0.1
port = 8080
base_path = /api
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/rest
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/rest/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/rest/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/rest/ignore
