# SAP/SDP announcement configuration
# Displayed in GUI: Window_2/.../4_Protocals/67_SAP
# Published to MQTT (retained) at: OpenAir/System/Config/sap
[sap]
enabled = true
multicast_address = 239.255.255.255
port = 9875
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/sap
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/sap/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/sap/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/sap/ignore
