# SAP/SDP announcement configuration
# Displayed in GUI: Window_2/.../4_Protocals/67_SAP
# Published to MQTT (retained) at: OpenAir/System/Config/sap
[sap]
enabled = true
# The listener joins all three well-known SAP groups, not just this one:
# 239.255.255.255 (admin scope — Dante/AES67), 224.2.127.254 (RFC 2974 global),
# 239.195.255.255 (org-local). This entry names the primary for display.
multicast_address = 239.255.255.255
port = 9875
# Device discovery lands under: OpenAir/System/Protocols/sap/Device/{ip}/{session}/{key}
# Sessions that stop announcing are cleared after 300s (SAP has no reliable goodbye).

# NOTE: no topic/topic_listen/topic_publish/topic_ignore keys here.
# This agent takes its broker address as a parameter and owns its topic in
# code; a declared triple that nothing reads is dead config, which the
# validator flags. Only add these keys if the agent actually reads them.
