# SMPTE ST 2138 (CCM / protobuf) protocol configuration
# Displayed in GUI: Window_2/.../4_Protocals/2138_SMPTE_2138
# Published to MQTT (retained) at: OpenAir/System/Config/smpte2138
[smpte2138]
enabled = true
host = 127.0.0.1
port = 50051
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/smpte2138
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/smpte2138/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/smpte2138/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/smpte2138/ignore
