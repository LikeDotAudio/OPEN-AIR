# SNMP protocol configuration
# Displayed in GUI: Window_2/.../4_Protocals/11_SNMP
# Published to MQTT (retained) at: OpenAir/System/Config/snmp
[snmp]
enabled = true
host = 127.0.0.1
port = 161
version = 2c
community = public
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/snmp
