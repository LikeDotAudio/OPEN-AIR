# WebSocket server configuration
# config.ini published to MQTT (retained) at: OpenAir/System/Config/websocket
[websocket]
enabled = true
host = 127.0.0.1
port = 8080
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/websocket
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/System/Protocols/websocket/sub
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/websocket/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/websocket/ignore
