[workspace]
resolver = "2"
# The orchestrator binary is a member; the oaRustCore package below is the
# implicit root member. Protocol crates live in their own sibling workspace
# (../ComProtocols) and are pulled in as path dependencies by the orchestrator.
members = [
    "orchestrator",
    "doclinks",
    "TestOrchestrator",
]

[package]
name = "oaRustCore"
version = "0.1.0"
edition = "2021"

[lib]
name = "oaRustCore"
crate-type = ["cdylib"]

[[bin]]
name = "test_ias_importer"
path = "DataMigration/1_IAS/test_ias_importer.rs"

[[bin]]
name = "test_soundbase_importer"
path = "DataMigration/2_Soundbase/test_soundbase_importer.rs"

[[bin]]
name = "test_wwb_importer"
path = "DataMigration/3_Wireless_Workbench/test_wwb_importer.rs"

[[bin]]
name = "test_csv_pattern_importer"
path = "DataMigration/4_CSV/test_csv_pattern_importer.rs"

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module"] }
numpy = "0.21.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
crossbeam-channel = "0.5"
dashmap = "5.5"
rayon = "1.8"
pythonize = "0.21"
nom = "7.1"
regex = "1.10"
midir = "0.9"
axum = "0.7"
rosc = "0.10"
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
prost = "0.12"
parking_lot = "0.12"
image = "0.24"
rand = "0.8"
noise = "0.8"
walkdir = "2.4"
csv = "1.3"
scraper = "0.18"
pdf-extract = "0.7"
zip = "0.6"
html-escape = "0.2"
uuid = { version = "1.6", features = ["v4"] }
validator = { version = "0.16", features = ["derive"] }
hex = "0.4"
tempfile = "3.8"
zstd = "0.11"
rumqttc = "0.24"

# Protocol crates now own their pyo3 submodules (oa_*_rs). oaRustCore pulls them
# in with the `python` feature and re-registers them in its #[pymodule] (lib.rs).
openair-aes70 = { path = "../ComProtocols/openair-aes70", features = ["python"] }
openair-ember = { path = "../ComProtocols/openair-ember", features = ["python"] }
openair-midi = { path = "../ComProtocols/openair-midi", features = ["python"] }
openair-mqtt = { path = "../ComProtocols/openair-mqtt", features = ["python"] }
openair-osc = { path = "../ComProtocols/openair-osc", features = ["python"] }
openair-ptp = { path = "../ComProtocols/openair-ptp", features = ["python"] }
openair-snmp = { path = "../ComProtocols/openair-snmp", features = ["python"] }
openair-smpte2138 = { path = "../ComProtocols/openair-smpte2138", features = ["python"] }
openair-visa = { path = "../ComProtocols/openair-visa", features = ["python"] }

[build-dependencies]
prost-build = "0.12"
