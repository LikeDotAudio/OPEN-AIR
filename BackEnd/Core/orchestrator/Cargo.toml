[package]
name = "open-air-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order is REQUIRED, not a preference. Panel JSON uses key order as
# layout: a template's top-level key order is its tab order (and the `0_`, `1_`
# prefixes derived from it), and a block's field order is the order widgets
# render in. serde_json's default sorts object keys alphabetically, which would
# silently reorder every generated tab and control surface.
serde_json = { version = "1.0", features = ["preserve_order"] }
crossbeam-channel = "0.5"
axum = { version = "0.7", features = ["ws"] }
config = "0.14"

openair-osc = { path = "../../ComProtocols/openair-osc" }
openair-midi = { path = "../../ComProtocols/openair-midi" }
openair-aes70 = { path = "../../ComProtocols/openair-aes70" }
openair-visa = { path = "../../ComProtocols/openair-visa" }
openair-dnssd = { path = "../../ComProtocols/openair-dnssd" }
openair-chromecast = { path = "../../ComProtocols/openair-ChromeCast" }
openair-ravenna = { path = "../../ComProtocols/openair-ravenna" }
openair-dante = { path = "../../ComProtocols/openair-Dante" }
openair-printers = { path = "../../ComProtocols/openair-printers" }
openair-appletv = { path = "../../ComProtocols/openair-AppleTV" }
openair-nmos = { path = "../../ComProtocols/openair-nmos" }
openair-sap = { path = "../../ComProtocols/openair-sap" }
openair-ptp = { path = "../../ComProtocols/openair-ptp" }
openair-avb-milan = { path = "../../ComProtocols/openair-AVB-Milan" }
clap = { version = "4.5", features = ["derive", "env"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
rust-ini = "0.21"
rumqttc = "0.24"
openair-contracts = { path = "../../../contracts/rust" }
walkdir = "2.5"
open = "5.1"
tower = "0.4"
chrono = "0.4"
regex = "1.10"

[build-dependencies]
cc = "1.0"
