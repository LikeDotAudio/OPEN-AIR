[package]
name = "open-air-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
axum = { version = "0.7", features = ["ws"] }
config = "0.14"

openair-osc = { path = "../../ComProtocols/openair-osc" }
openair-midi = { path = "../../ComProtocols/openair-midi" }
openair-aes70 = { path = "../../ComProtocols/openair-aes70" }

[build-dependencies]
cc = "1.0"
