[package]
name = "open-air-orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
axum = { version = "0.7", features = ["ws"] }
config = "0.14"

openair-osc = { path = "../../ComProtocols/openair-osc" }
openair-midi = { path = "../../ComProtocols/openair-midi" }
openair-aes70 = { path = "../../ComProtocols/openair-aes70" }
openair-visa = { path = "../../ComProtocols/openair-visa" }
clap = { version = "4.5", features = ["derive"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
rust-ini = "0.21"
rumqttc = "0.24"
openair-contracts = { path = "../../../contracts/rust" }
walkdir = "2.5"
open = "5.1"
tower = "0.4"
chrono = "0.4"
regex = "1.10"

[build-dependencies]
cc = "1.0"
