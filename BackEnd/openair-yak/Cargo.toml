# The YAK agent is its own back end — a standalone workspace, not a member of
# BackEnd/ComProtocols. It is the definition plane (GUI intent -> vendor SCPI),
# not a wire protocol, and Cargo requires members to live below their workspace
# root, so moving it up here necessarily took it out of that workspace.
[workspace]

[package]
name = "openair-yak"
version = "0.1.0"
edition = "2024"

[dependencies]
openair-contracts = { path = "../../contracts/rust" }
tokio = { version = "1", features = ["full"] }
rumqttc = "0.24.0"
serde = { version = "1.0", features = ["derive"] }
# preserve_order: the generated JSON has a required key order. knownDevices.json
# records read manufacturer/type/notes/commands, and the alphabetical order
# serde_json defaults to would rewrite all 181 of them on the first run.
serde_json = { version = "1.0", features = ["preserve_order"] }
log = "0.4"
env_logger = "0.11"
rust-ini = "0.21.0"
clap = { version = "4.5", features = ["derive"] }
# The command tables also ship as a report: Yak/CommandList.csv (+ .xlsx), both
# tracked in git, so both have to be regenerated by the same command.
csv = "1.3"
rust_xlsxwriter = "0.79"
