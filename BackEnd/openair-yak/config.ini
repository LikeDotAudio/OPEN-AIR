# YAK monitor configuration
# config.ini published to MQTT (retained) at: OpenAir/System/Config/yak
[yak]
enabled = true
# MQTT topic where this protocol talks (publishes/subscribes its live data).
topic = OpenAir/System/Protocols/yak
# MQTT topic this protocol SUBSCRIBES to (listens for inbound commands/data).
topic_listen = OpenAir/Gui/Protocols/Yak/#
# MQTT topic this protocol PUBLISHES its outbound data to.
topic_publish = OpenAir/System/Protocols/yak/pub
# MQTT topic this protocol IGNORES (e.g. its own echoes / muted traffic).
topic_ignore = OpenAir/System/Protocols/yak/ignore
# Send the SHORT form of a command where the table carries a `scpiFast`.
# "The short form provides the fastest program execution" (6060B programming
# manual, ch.2). Off by default: the long form is what the tables were swept as
# and what a monitor log is readable in.
prefer_short_scpi = false
