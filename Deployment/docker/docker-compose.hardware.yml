# OPEN-AIR — local hardware overlay (USB instruments + MIDI).
#
#     python3 Deployment/docker/launch.py --host-net --hardware
#     docker compose -f Deployment/docker/docker-compose.yml \
#                    -f Deployment/docker/docker-compose.host.yml \
#                    -f Deployment/docker/docker-compose.hardware.yml up
#
# WHY THIS EXISTS
#
# A container sees none of the host's hardware by default — no /dev/snd, no
# /dev/bus/usb. So without this overlay:
#
#   * the MIDI agent (midir → ALSA) enumerates zero devices, and
#   * USB instruments (USBTMC, and anything pyvisa reaches through libusb) are
#     invisible, however firmly they are plugged in.
#
# Neither failure is loud. Both just report "no devices found", which looks
# identical to having nothing connected.
#
# ── Why bind-mount the whole bus instead of listing `devices:` ────────────────
# A `devices:` entry is resolved once, at container start. A device plugged in
# later never appears, and a device that was not attached at start prevents the
# container from starting at all. Bind-mounting /dev/bus/usb plus a cgroup rule
# for the major number means hot-plugged instruments show up in a running
# container — which is how a bench is actually used.
#
# Majors (verified on this host, /proc/devices):
#   116 = ALSA sound (/dev/snd/*)      — MIDI
#   189 = USB serial-bus devices       — /dev/bus/usb/*, libusb
#   180 = USB char devices             — /dev/usbtmc* (USBTMC instruments)
#
# ── Note on privilege ────────────────────────────────────────────────────────
# This grants the container read/write on those device classes. That is a real
# privilege increase over the default, and it is why hardware access is a
# separate opt-in overlay rather than part of the base compose file. It is still
# far narrower than `privileged: true`, which would hand over every device on the
# machine — do not reach for that instead.

services:
  orchestrator:
    volumes:
      # Bind-mounted (not `devices:`) so hot-plug works — see above.
      - /dev/bus/usb:/dev/bus/usb
      - /dev/snd:/dev/snd
    device_cgroup_rules:
      - 'c 116:* rmw'   # ALSA  — MIDI in/out
      - 'c 189:* rmw'   # usbfs — libusb / pyvisa USB backend
      - 'c 180:* rmw'   # usbtmc — USB Test & Measurement instruments
    group_add:
      # Numeric GIDs, because these groups must exist INSIDE the container to be
      # named — and in a slim image they do not. The host's numeric ids are what
      # the kernel checks against the device nodes.
      - "29"   # audio  (host gid) — /dev/snd
      - "46"   # plugdev (host gid) — USB
