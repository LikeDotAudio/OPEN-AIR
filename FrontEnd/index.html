    <!-- Main App Bootstrapper -->
    <script type="text/babel">
        function App() {
            const [directoryTree, setDirectoryTree] = React.useState(null);
            const [error, setError] = React.useState(null);
            const isDeepLink = window.location.hash && window.location.hash.includes('__win=');
            const [splashFinished, setSplashFinished] = React.useState(isDeepLink);

            React.useEffect(() => {
                let splashTimer;
                if (!isDeepLink) {
                    // Enforce a minimum splash screen time (2.5s) to appreciate the animation
                    splashTimer = setTimeout(() => {
                        setSplashFinished(true);
                    }, 2500);
                }

                // Fetch the directory structure from our statically generated JSON
                fetch('./api/tree.json?t=' + new Date().getTime())
                    .then(res => {
                        if (!res.ok) throw new Error("Failed to fetch layout tree from ./api/tree.json");
                        return res.json();
                    })
                    .then(data => {
                        setDirectoryTree(data);
                    })
                    .catch(err => {
                        console.error(err);
                        setError(err.toString());
                    });
                    
                return () => clearTimeout(splashTimer);
            }, []);

            if (error) {
                return (
                    <div style={{ padding: '20px', color: '#ff5252' }}>
                        <h3>Boot Sequence Error</h3>
                        <p>{error}</p>
                        <p>Ensure that LauchWebserver.py is running on localhost.</p>
                    </div>
                );
            }

            // If we don't even have the tree yet, we MUST wait
            if (!directoryTree) {
                return (
                    <div style={{
                        display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center',
                        height: '100vh', width: '100vw', backgroundColor: 'black', color: '#f4902c', fontFamily: 'sans-serif'
                    }}>
                        <img src="./assets/splash_logo.gif" alt="OPEN-AIR Splash" style={{ maxWidth: '80%', maxHeight: '60vh', objectFit: 'contain', marginBottom: '20px' }} />
                        <h2 style={{ letterSpacing: '2px', textTransform: 'uppercase', animation: 'pulse 1.5s infinite' }}>Booting OPEN-AIR Kernel...</h2>
                        <style>{`
                            @keyframes pulse {
                                0% { opacity: 0.6; }
                                50% { opacity: 1; }
                                100% { opacity: 0.6; }
                            }
                        `}</style>
                    </div>
                );
            }

            // MQTT connection config comes from oaGetMqttConfig (comMQTT/MqttSettings.jsx):
            //   - a saved profile in localStorage (host/port/ws-vs-wss/path/auth), set
            //     via the MQTT settings modal, OR
            //   - ?mqtt=X.X.X.X host override, OR
            //   - the page host + :9001 (the local Python broker) as the default.
            // Saved auth may be anonymous (empty user) for public test brokers.
            const _mqttCfg = (window.oaGetMqttConfig
                ? window.oaGetMqttConfig()
                : { brokerUrl: `${window.location.protocol === 'https:' ? 'wss' : 'ws'}://${window.location.hostname || 'localhost'}:9001`, username: 'guest', password: 'guest' });
            const dynamicBrokerUrl = _mqttCfg.brokerUrl;

            return (
                <React.Fragment>
                    {/* The splash screen renders ON TOP if the timer isn't finished yet */}
                    {!splashFinished && (
                        <div style={{
                            position: 'fixed', top: 0, left: 0, zIndex: 9999,
                            display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center',
                            height: '100vh', width: '100vw', backgroundColor: 'black', color: '#f4902c', fontFamily: 'sans-serif'
                        }}>
                            <img src="./assets/splash_logo.gif" alt="OPEN-AIR Splash" style={{ maxWidth: '80%', maxHeight: '60vh', objectFit: 'contain', marginBottom: '20px' }} />
                            <h2 style={{ letterSpacing: '2px', textTransform: 'uppercase', animation: 'pulse 1.5s infinite' }}>Booting OPEN-AIR Kernel...</h2>
                            <style>{`
                                @keyframes pulse {
                                    0% { opacity: 0.6; }
                                    50% { opacity: 1; }
                                    100% { opacity: 0.6; }
                                }
                            `}</style>
                        </div>
                    )}
                    
                    {/* The app mounts IN THE BACKGROUND so the lazy loader starts crushing the fetching immediately! */}
                    <div style={{ display: splashFinished ? 'block' : 'none', height: '100vh', width: '100vw' }}>
                        <window.MqttProvider brokerUrl={dynamicBrokerUrl} username={_mqttCfg.username} password={_mqttCfg.password}>
                            <window.WindowManager directoryTree={directoryTree} />
                        </window.MqttProvider>
                    </div>
                </React.Fragment>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(registration => {
                    console.log('ServiceWorker registered:', registration);
                })
                .catch(error => {
                    console.error('ServiceWorker registration failed:', error);
                });
            });
        }
    </script>
