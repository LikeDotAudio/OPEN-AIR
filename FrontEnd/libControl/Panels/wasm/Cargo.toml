# frontEnd/libControl/Panels/wasm/Cargo.toml
# Author: Anthony Peter Kuzub
#
# Lean, browser-targeted (wasm32) port of the procedural panel + screw engine.
# This is intentionally SEPARATE from oaRustCore_pkg: that crate is a PyO3
# cdylib with a heavy native dependency tree (tokio/axum/midir/pdf-extract …)
# that cannot cross-compile to wasm. Here we carry only the pure pixel math
# (image buffers, perlin noise, seeded RNG) so `wasm-pack build` succeeds.
[package]
name = "oa_panels"
version = "0.1.0"
edition = "2021"
description = "Procedural industrial panel + screw background generator (WASM)"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
# default-features = false drops every image codec (png/jpeg/…); we only need
# the in-memory ImageBuffer + imageops (resize/blur), which stay available.
image = { version = "0.24", default-features = false }
noise = "0.8"
rand = "0.8"
serde_json = "1"
# getrandom with the `js` feature lets anything in the dependency graph that
# pulls getrandom still COMPILE for wasm32-unknown-unknown (we only ever seed
# deterministically, so it is never actually called at runtime).
getrandom = { version = "0.2", features = ["js"] }

# Smaller, faster .wasm — backgrounds are generated once per resize, so we
# optimize for size over compile time.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
