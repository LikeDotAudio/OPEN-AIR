<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Input Components</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #2c2c2c;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="InputElements/InputElements.jsx"></script>
    <script type="text/babel">
        function App() {
            const [checked, setChecked] = React.useState(false);
            const [numVal, setNumVal] = React.useState(0);
            const [selectedOpt, setSelectedOpt] = React.useState('Option 1');

            return (
                <div className="container">
                    <h3>Input Elements</h3>
                    <OcaCheckbox label="Enable Feature" checked={checked} onChange={setChecked} />
                    <OcaIncDecButtons label="Volume Offset" value={numVal} onChange={setNumVal} min={-10} max={10} step={1} />
                    <OcaDropdown 
                        label="Select Mode" 
                        value={selectedOpt} 
                        onChange={setSelectedOpt} 
                        options={['Option 1', 'Option 2', 'Option 3']} 
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
