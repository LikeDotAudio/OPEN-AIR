# OPEN-AIR broker configuration — Phase 0 item 6: the broker stops being an
# unmanaged assumption. Run with:
#   mosquitto -c broker/mosquitto.conf
#
# Two listeners, matching what every component already assumes:
#   1883  — plain MQTT (Rust agents, Python tools, mosquitto_sub debugging)
#   9001  — MQTT over WebSockets (the browser: MqttProvider.jsx)
#
# ─────────────────────────────────────────────────────────────────────────────
# SECURITY — read before changing a bind_address
#
# The bus is not a passive transport. Publishing to
#   OpenAir/System/Protocols/visa/Device/+/+/+/Write
# causes the orchestrator to execute that payload as a SCPI command on real
# lab hardware. Anyone who can publish to this broker can drive every
# instrument on the bench.
#
# Until authentication is enforced end-to-end, both listeners bind to
# loopback, so only processes on this machine can reach them. This is the
# single change that turned an unauthenticated remote foothold into a local
# one; the command-injection bug it was paired with is fixed separately
# (VISA_WRITE_SCRIPT now takes argv, not interpolated source).
# ─────────────────────────────────────────────────────────────────────────────

# Plain MQTT — loopback only.
listener 1883 127.0.0.1
protocol mqtt

# MQTT over WebSockets for the browser — loopback only.
# The browser must therefore run on this machine, which matches the
# documented single-box quick start.
listener 9001 127.0.0.1
protocol websockets

# Anonymous access is acceptable ONLY because of the loopback binding above.
# These two settings are a pair: change one and you must change the other.
allow_anonymous true

# ── Exposing the broker to a LAN ─────────────────────────────────────────────
# Required for: a browser on another machine, agents on another host, or a
# second-machine test. Do ALL of the following together — never just the
# bind_address:
#
#   1. Create a password file:
#        mosquitto_passwd -c broker/passwd openair
#   2. Enable it and turn anonymous off:
#        password_file broker/passwd
#        allow_anonymous false
#   3. Widen the listeners (drop the 127.0.0.1 suffix, or name an interface):
#        listener 1883 0.0.0.0
#        listener 9001 0.0.0.0
#   4. Give every agent credentials — each config.ini needs the username and
#      password, and MqttSettings.jsx needs them for the browser.
#   5. Restrict what those credentials may publish, so a compromised UI
#      client cannot drive hardware:
#        acl_file broker/acl
#
# Step 5 matters most: without an ACL, any authenticated client can still
# publish to .../Write. A ready-made policy — separating agents, the UI, and a
# human operator — ships as `broker/acl.example`:
#
#        cp broker/acl.example broker/acl
#
# Keep broker/passwd and broker/acl OUT of git.
# ─────────────────────────────────────────────────────────────────────────────

# Retained state is the database (design decision — see the audit §3.1):
# persist it across broker restarts.
persistence true
persistence_location /var/lib/mosquitto/

# Reasonable hygiene
max_keepalive 120
