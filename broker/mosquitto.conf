# OPEN-AIR broker configuration — Phase 0 item 6: the broker stops being an
# unmanaged assumption. Run with:
#   mosquitto -c broker/mosquitto.conf
#
# Two listeners, matching what every component already assumes:
#   1883  — plain MQTT (Rust agents, Python tools, mosquitto_sub debugging)
#   9001  — MQTT over WebSockets (the browser: MqttProvider.jsx)

# Plain MQTT
listener 1883
protocol mqtt

# MQTT over WebSockets for the browser
listener 9001
protocol websockets

# The system currently connects anonymously or as guest/guest; keep anonymous
# on until credentials are actually enforced end-to-end (then switch to
# password_file and set allow_anonymous false).
allow_anonymous true

# Retained state is the database (design decision — see the audit §3.1):
# persist it across broker restarts.
persistence true
persistence_location /var/lib/mosquitto/

# Reasonable hygiene
max_keepalive 120
