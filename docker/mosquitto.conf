# OPEN-AIR broker configuration — CONTAINER variant (used by docker-compose.yml).
#
# Why this differs from broker/mosquitto.conf:
#
# The bare-metal config binds 127.0.0.1 because there is nothing else between the
# broker and the network. Inside a container, 127.0.0.1 would mean *the
# container's own loopback*, which the orchestrator container cannot reach — so
# these listeners bind 0.0.0.0, and the **compose port mapping** is what confines
# them: every published port is `127.0.0.1:<port>:<port>`, so nothing is reachable
# from off-host.
#
# The confinement therefore lives in docker-compose.yml, not here. If you change
# a port mapping to `0.0.0.0` or remove the host-IP prefix, you have exposed an
# anonymous broker that can drive lab hardware — enable authentication and an ACL
# first (see broker/acl.example).

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Safe only because compose publishes these ports to host loopback.
# To expose on a LAN: set `allow_anonymous false`, add `password_file` and
# `acl_file`, and give every agent credentials. See broker/acl.example.
allow_anonymous true

# Retained state is the database: persist it across broker restarts.
# Backed by the `broker-data` volume in compose.
persistence true
persistence_location /mosquitto/data/

max_keepalive 120
