<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPEN-AIR HTML5 GUI</title>
    <link rel="icon" href="data:,">
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- ECharts (for graphs) -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        #root {
            width: 100%;
            height: 100%;
        }
        
        /* Scrollbar styles for dark theme */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #111; 
        }
        ::-webkit-scrollbar-thumb {
            background: #444; 
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Load Component Library -->
    <script type="text/babel" src="../../libControl/faders/core/utils.js?v=2"></script>
    <script type="text/babel" src="../../libControl/faders/core/Scale.jsx?v=2"></script>
    <script type="text/babel" src="../../libControl/faders/core/Cap.jsx?v=2"></script>
    <script type="text/babel" src="../../libControl/faders/core/Fader.jsx?v=2"></script>
    <script type="text/babel" src="../../libControl/faders/DualFader.jsx"></script>
    <script type="text/babel" src="../../libControl/faders/LTPFader.jsx"></script>
    <script type="text/babel" src="../../libControl/faders/FaderDial.jsx"></script>
    <script type="text/babel" src="../../libControl/faders/FaderWithMeter.jsx"></script>
    <script type="text/babel" src="../../libControl/Knobs/Knob.jsx"></script>
    <script type="text/babel" src="../../libControl/Knobs/SelectorSwitch.jsx"></script>
    <script type="text/babel" src="../../libControl/metering/MeterBarGraph.jsx"></script>
    <script type="text/babel" src="../../libControl/metering/NeedleMeter.jsx"></script>
    <script type="text/babel" src="../../libControl/special/CMDP.jsx"></script>
    <script type="text/babel" src="../../libControl/graphing/DynamicGraph.jsx"></script>
    <script type="text/babel" src="../../libControl/buttons/Button.jsx"></script>
    <script type="text/babel" src="../../libControl/buttons/WinkButton.jsx"></script>
    <script type="text/babel" src="../../libControl/buttons/TrapezoidButton.jsx"></script>
    <script type="text/babel" src="../../libControl/text/TextElements.jsx"></script>
    <script type="text/babel" src="../../libControl/text/OcaTable.jsx"></script>
    <script type="text/babel" src="../../libControl/input/InputElements.jsx"></script>
    <script type="text/babel" src="../../libControl/input/JsonTree.jsx"></script>
    <script type="text/babel" src="../../libControl/special/MidiKeyboard.jsx"></script>
    <script type="text/babel" src="../../libControl/special/StatusLight.jsx"></script>
    <script type="text/babel" src="../../libControl/images/ImageDisplay.jsx"></script>
    <script type="text/babel" src="../../libControl/BreakLine.jsx"></script>

    <!-- Load MQTT & Layout & Navigation Engines -->
    <script type="text/babel" src="../../comMQTT/MqttProvider.jsx"></script>
    <script type="text/babel" src="../../frameLayout/WidgetFactory.jsx?v=2"></script>
    <script type="text/babel" src="../../frameLayout/SplitLayout.jsx"></script>
    <script type="text/babel" src="../../frameLayout/TabLayout.jsx"></script>
    <script type="text/babel" src="../../frameLayout/LoaderOrchestrator.jsx"></script>
    <script type="text/babel" src="../../tabManager/WindowManager.jsx"></script>

    <!-- Main App Bootstrapper -->
    <script type="text/babel">
        function App() {
            const [directoryTree, setDirectoryTree] = React.useState(null);
            const [error, setError] = React.useState(null);

            React.useEffect(() => {
                // Fetch the directory structure from our Python Web Server
                fetch('/api/tree')
                    .then(res => {
                        if (!res.ok) throw new Error("Failed to fetch layout tree from /api/tree");
                        return res.json();
                    })
                    .then(data => {
                        setDirectoryTree(data);
                    })
                    .catch(err => {
                        console.error(err);
                        setError(err.toString());
                    });
            }, []);

            if (error) {
                return (
                    <div style={{ padding: '20px', color: '#ff5252' }}>
                        <h3>Boot Sequence Error</h3>
                        <p>{error}</p>
                        <p>Ensure that LauchWebserver.py is running on localhost.</p>
                    </div>
                );
            }

            if (!directoryTree) {
                return (
                    <div style={{ display: 'flex', width: '100%', height: '100%', alignItems: 'center', justifyContent: 'center' }}>
                        <h2>🚀 Booting OPEN-AIR Environment...</h2>
                    </div>
                );
            }

            // Once loaded, hand off orchestration to WindowManager
            return (
                <window.MqttProvider brokerUrl="ws://localhost:9001">
                    <window.WindowManager directoryTree={directoryTree} />
                </window.MqttProvider>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        // Slight delay to ensure scripts are evaluated by Babel before mounting
        setTimeout(() => root.render(<App />), 100);
    </script>
</body>
</html>
