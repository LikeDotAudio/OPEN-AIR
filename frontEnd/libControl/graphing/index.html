<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Dynamic Graph Component</title>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body {
            background-color: #2c2c2c;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80%;
            height: 80%;
        }
    </style>
</head>
<body>
    <div id="root" class="container"></div>

    <script type="text/babel" src="DynamicGraph.jsx"></script>
    <script type="text/babel">
        function App() {
            const [data, setData] = React.useState([]);

            React.useEffect(() => {
                const interval = setInterval(() => {
                    const now = new Date();
                    const value = Math.random() * 100;
                    
                    setData(prevData => {
                        const newData = [...prevData, { name: now.toString(), value: [now.toISOString(), value] }];
                        if (newData.length > 50) newData.shift(); // Keep last 50 points
                        return newData;
                    });
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div style={{ width: '100%', height: '100%' }}>
                    <h3>Real-Time MQTT Telemetry Graph</h3>
                    <DynamicGraph data={data} title="Sensor Data" />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
