<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React CMDP Component</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            background-color: #2c2c2c;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="CMDP.jsx"></script>
    <script type="text/babel">
        function App() {
            const [value, setValue] = React.useState(0); // Angle in degrees

            return (
                <div className="container">
                    <h3>Circular Motion Displacement Potentiometer (CMDP)</h3>
                    <CMDP 
                        value={value} 
                        onChange={setValue} 
                        size={200} 
                    />
                    <p>Angle: {Math.round(value)}&deg;</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
