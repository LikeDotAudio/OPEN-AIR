# Simplified Mosquitto Configuration for OPEN-AIR
# Removed restricted paths to ensure it runs without permission issues.

# 🌐 Standard MQTT Listener (Core Hardware Bridge)
listener 1883
allow_anonymous true

# 🌐 WebSocket Listener (HTML5 React GUI)
listener 9001
protocol websockets
allow_anonymous true

# ⚡ V2.0+ Mandatory Setting:
# If you don't define a listener, it defaults to localhost only.
# Defining listeners explicitly is safer.
