[package]
name = "oaembertree-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oaembertree_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
nom = "7.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
