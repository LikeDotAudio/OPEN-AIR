[package]
name = "oamidiengine-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oamidiengine_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
midir = "0.9"
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
