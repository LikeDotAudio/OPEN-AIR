[package]
name = "oast2138codec-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oast2138codec_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
prost-build = "0.13"
