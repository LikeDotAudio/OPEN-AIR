[package]
name = "oavisascanner-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oavisascanner_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
