[package]
name = "oaconfigengine-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oaconfigengine_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22.6", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.16", features = ["derive"] }
