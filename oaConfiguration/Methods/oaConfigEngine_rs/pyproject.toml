[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "oaconfigengine_rs"
version = "0.1.0"
description = "Native Rust configuration engine for OPEN-AIR."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Gemini Iron Oxide Architect"}]
dependencies = []

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "oaconfigengine_rs.oaconfigengine_rs"
