[package]
name = "oacsvwriter-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oacsvwriter_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
