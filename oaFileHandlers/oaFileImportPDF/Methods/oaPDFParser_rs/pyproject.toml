[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "oapdfparser_rs"
version = "0.1.0"
description = "Native PDF text extraction engine for SoundBase reports."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Gemini Iron Oxide Architect"}]
dependencies = []

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "oapdfparser_rs.oapdfparser_rs"
