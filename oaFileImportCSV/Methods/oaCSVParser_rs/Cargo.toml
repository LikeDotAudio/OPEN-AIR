[package]
name = "oacsvparser-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oacsvparser_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
regex = "1.10"
polars = { version = "0.41", features = ["csv", "lazy"] }
