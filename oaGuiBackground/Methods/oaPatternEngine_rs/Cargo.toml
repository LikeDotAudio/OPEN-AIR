[package]
name = "oapatternengine-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oapatternengine_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
image = "0.24"
rand = "0.8"
noise = "0.8"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
