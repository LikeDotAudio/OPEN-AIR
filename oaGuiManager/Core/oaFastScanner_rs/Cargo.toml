[package]
name = "oafastscanner-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oafastscanner_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
walkdir = "2.3"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
