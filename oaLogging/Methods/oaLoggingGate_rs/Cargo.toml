[package]
name = "oalogginggate_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oalogginggate_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
dashmap = "5.5.3"
once_cell = "1.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
