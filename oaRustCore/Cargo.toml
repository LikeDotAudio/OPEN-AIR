[package]
name = "oaRustCore"
version = "0.1.0"
edition = "2021"

[lib]
name = "oaRustCore"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module"] }
numpy = "0.21.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
crossbeam-channel = "0.5"
dashmap = "5.5"
rayon = "1.8"
pythonize = "0.21"
nom = "7.1"
regex = "1.10"
midir = "0.9"
axum = "0.7"
rosc = "0.10"
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
prost = "0.12"
parking_lot = "0.12"
image = "0.24"
rand = "0.8"
noise = "0.8"
walkdir = "2.4"
csv = "1.3"
scraper = "0.18"
pdf-extract = "0.7"
zip = "0.6"
html-escape = "0.2"
uuid = { version = "1.6", features = ["v4"] }
validator = { version = "0.16", features = ["derive"] }
hex = "0.4"
tempfile = "3.8"
zstd = "0.11"

[build-dependencies]
prost-build = "0.12"
