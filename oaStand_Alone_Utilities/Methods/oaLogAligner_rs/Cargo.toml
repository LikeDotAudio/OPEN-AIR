[package]
name = "oalogaligner-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oalogaligner_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.0", features = ["extension-module"] }
memmap2 = "0.9"
chrono = "0.4"
rayon = "1.5"
regex = "1.10"
clap = { version = "4.0", features = ["derive"] }
walkdir = "2.4"
