[package]
name = "oadiskflusher-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oadiskflusher_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tempfile = "3.8"
log = "0.4"
hex = "0.4"
