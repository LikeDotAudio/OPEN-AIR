[package]
name = "oataskpool-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oataskpool_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
rayon = "1.7"
crossbeam = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
