[package]
name = "oatranslatorcore_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "oatranslatorcore_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22.6", features = ["extension-module"] }
serde_json = "1.0"
pythonize = "0.22"
serde = { version = "1.0", features = ["derive"] }
dashmap = "6.1"

[profile.release]
lto = true
codegen-units = 1
