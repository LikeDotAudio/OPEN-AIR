[pytest]
# Each oa* module has its own Tests/ package, so the default "prepend" import
# mode collides on the duplicate "Tests" package name (ModuleNotFoundError:
# No module named 'Tests.x'). importlib mode imports each test by file path and
# avoids the collision (fixed 141 of 143 collection errors).
addopts = --import-mode=importlib
asyncio_mode = auto
